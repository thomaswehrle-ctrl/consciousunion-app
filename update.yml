name: App aktualisieren
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install html2text
      - run: python build.py
      - name: Änderungen speichern
        run: |
          git config user.name "Conscious Union Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "App aktualisiert" && git push)
